<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 fw-bold ps-3">My To-Do List</span>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow border-0 rounded-4 p-4">
                    
                    <h2 class="text-center fw-bold mb-1">Task Manager</h2>
                    <p class="text-center text-muted mb-4">Organize your tasks and stay productive.</p>

                    <!-- Input Section -->
                    <div class="input-group mb-3">
                        <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task..." aria-label="Task input">
                        <button class="btn btn-primary px-4 fw-medium" type="button" id="addTaskBtn">Add Task</button>
                    </div>

                    <!-- Input Error Message -->
                    <div id="errorMessage" class="text-danger small mb-3 d-none">
                        Please enter a valid task!
                    </div>

                    <!-- Task Counter -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fw-semibold text-secondary">Your tasks</span>
                        <span class="badge bg-primary rounded-pill fs-6 px-3 py-2" id="taskCounter">0 remaining</span>
                    </div>

                    <!-- Filter Buttons -->
                    <div class="btn-group w-100 mb-4" role="group" aria-label="Task filters">
                        <button type="button" class="btn btn-primary active" id="filterAll">All</button>
                        <button type="button" class="btn btn-outline-primary" id="filterActive">Active</button>
                        <button type="button" class="btn btn-outline-primary" id="filterCompleted">Completed</button>
                    </div>

                    <!-- Task List -->
                    <ul class="list-group mb-4" id="taskList">
                        <!-- Tasks dynamically added here -->
                    </ul>

                    <!-- Clear Completed Button -->
                    <div class="d-flex justify-content-end">
                        <button class="btn btn-outline-danger btn-sm" id="clearCompletedBtn">Clear Completed</button>
                    </div>

                </div>

                <!-- Footer text -->
                <p class="text-center text-muted small mt-4">Full-Stack Development Practical</p>
            </div>
        </div>
    </div>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
